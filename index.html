<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>משו״ב - שחרורית</title>
    <meta name="description" content="דף שחרורית מותאם ל-GitHub Pages" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <button class="menu-button" aria-label="פתיחת תפריט">
        <span></span><span></span><span></span>
      </button>

      <p>משו״ב - שחרורית</p>

      <div class="top-actions" aria-label="פעולות">
        <button aria-label="חזרה" class="back">‹</button>

        <button aria-label="התראות" class="bell">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 16v-5a6 6 0 0 0-4.5-5.8V4a1.5 1.5 0 0 0-3 0v1.2A6 6 0 0 0 6 11v5l-2 2h16l-2-2Zm-6 6a2.2 2.2 0 0 0 2.1-2.1H9.9A2.2 2.2 0 0 0 12 22Z" />
          </svg>
        </button>

        <button aria-label="עזרה" class="icon-button">
          <svg
            viewBox="0 0 24 24"
            height="100%"
            width="100%"
            preserveAspectRatio="xMidYMid meet"
            focusable="false"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" fill="rgb(14, 103, 52)" />
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <h1>שחרורית</h1>

      <section class="panel" aria-labelledby="sent-title">
        <div class="controls">
          <label class="toggle-row">
            <span class="switch off">
              <input
                type="checkbox"
                aria-label="הצגת בקשות שפג תוקפן"
              />
              <i aria-hidden="true">
                <svg class="switch-icon switch-icon--off" viewBox="0 0 24 24">
                  <path d="M20 13H4v-2h16v2z" />
                </svg>
                <svg class="switch-icon switch-icon--on" viewBox="0 0 24 24">
                  <path d="m9 16.17-4.17-4.18L3.41 13.4 9 19l12-12-1.41-1.41z" />
                </svg>
              </i>
            </span>
            הצגת בקשות שפג תוקפן
          </label>

          <label class="toggle-row">
            <span class="switch">
              <input
                type="checkbox"
                checked
                aria-label="סידור בקשות מהחדש לישן"
              />
              <i aria-hidden="true">
                <svg class="switch-icon switch-icon--off" viewBox="0 0 24 24">
                  <path d="M20 13H4v-2h16v2z" />
                </svg>
                <svg class="switch-icon switch-icon--on" viewBox="0 0 24 24">
                  <path d="m9 16.17-4.17-4.18L3.41 13.4 9 19l12-12-1.41-1.41z" />
                </svg>
              </i>
            </span>
            סידור בקשות מהחדש לישן
          </label>
        </div>

        <article class="release-card">
          <h2 id="sent-title">בקשות שחרור שנשלחו</h2>

          <div class="table-head">
            <span>תאריך<br />שחרור</span>
            <span>שעות</span>
            <span>סטטוס</span>
            <span aria-hidden="true"></span>
          </div>

          <div class="release-row">
            <div class="release-actions">
              <button
                type="button"
                class="more"
                aria-label="פעולות נוספות"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="release-menu"
              >
                <span aria-hidden="true">⋮</span>
              </button>

              <div
                id="release-menu"
                class="release-menu"
                role="menu"
                aria-label="פעולות נוספות"
                dir="rtl"
                hidden
              >
                <button
                  type="button"
                  class="release-menu-item"
                  role="menuitem"
                  tabindex="-1"
                >
                  <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                  </svg>
                  <span>הצגת אישור</span>
                </button>
              </div>
            </div>

            <span class="status">התקבל</span>
            <time id="rounded-time">22:00</time>
            <time id="today">14/09/26</time>
          </div>
        </article>
      </section>
    </main>

    <script>
      (() => {
        function updateReleaseTimestamp() {
          const now = new Date();
          const rounded = new Date(now);

          // Round down to the previous 30-minute interval.
          rounded.setMinutes(
            Math.floor(now.getMinutes() / 30) * 30,
            0,
            0
          );

          const date = document.querySelector('#today');
          const time = document.querySelector('#rounded-time');

          date.textContent = new Intl.DateTimeFormat('en-GB', {
            day: '2-digit',
            month: '2-digit',
            year: '2-digit'
          }).format(now);

          time.textContent = new Intl.DateTimeFormat('en-GB', {
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23'
          }).format(rounded);
        }

        updateReleaseTimestamp();
        setInterval(updateReleaseTimestamp, 1000);

        const trigger = document.querySelector('.more');
        const menu = document.querySelector('#release-menu');
        const item = menu.querySelector('[role="menuitem"]');

        // Prevent the popup from being clipped by the card.
        document.body.appendChild(menu);

        function positionMenu() {
          const rect = trigger.getBoundingClientRect();
          const gap = 4;
          const margin = 8;
          const width = menu.offsetWidth;
          const height = menu.offsetHeight;

          const left = Math.max(
            margin,
            Math.min(rect.left, window.innerWidth - width - margin)
          );

          let top = rect.bottom + gap;

          if (top + height > window.innerHeight - margin) {
            top = rect.top - height - gap;
          }

          menu.style.left = `${left}px`;
          menu.style.top = `${Math.max(margin, top)}px`;
        }

        function closeMenu(restoreFocus = false) {
          menu.hidden = true;
          trigger.setAttribute('aria-expanded', 'false');

          if (restoreFocus) {
            trigger.focus();
          }
        }

        function openMenu() {
          menu.hidden = false;
          trigger.setAttribute('aria-expanded', 'true');
          positionMenu();
          item.focus({ preventScroll: true });
        }

        trigger.addEventListener('click', () => {
          if (menu.hidden) {
            openMenu();
          } else {
            closeMenu(true);
          }
        });

        trigger.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            openMenu();
          }
        });

        document.addEventListener('click', (event) => {
          if (
            !trigger.contains(event.target) &&
            !menu.contains(event.target)
          ) {
            closeMenu();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (!menu.hidden && event.key === 'Escape') {
            event.preventDefault();
            closeMenu(true);
          }
        });

        menu.addEventListener('keydown', (event) => {
          if (
            ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)
          ) {
            event.preventDefault();
            item.focus();
          }
        });

        document.addEventListener('focusin', (event) => {
          if (
            !trigger.contains(event.target) &&
            !menu.contains(event.target)
          ) {
            closeMenu();
          }
        });

        window.addEventListener('resize', () => {
          if (!menu.hidden) {
            positionMenu();
          }
        });

        window.addEventListener(
          'scroll',
          () => {
            if (!menu.hidden) {
              positionMenu();
            }
          },
          true
        );

        item.addEventListener('click', () => closeMenu(true));
      })();
    </script>
  </body>
</html>
